<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Canvas Typography</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        }

        canvas {
            display: block;
        }

        .controls {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            color: white;
            backdrop-filter: blur(10px);
        }

        .control-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 12px;
            margin-bottom: 5px;
            color: #aaa;
        }

        input, select {
            width: 200px;
            padding: 5px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 8px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #764ba2;
        }

        .info {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: #666;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div class="controls">
        <div class="control-group">
            <label>Text</label>
            <input type="text" id="textInput" value="CREATIVE" maxlength="10">
        </div>
        
        <div class="control-group">
            <label>Animation</label>
            <select id="animationType">
                <option value="wave">Wave</option>
                <option value="particles">Particles</option>
                <option value="morph">Morph</option>
                <option value="explode">Explode</option>
                <option value="flow">Flow</option>
            </select>
        </div>
        
        <div class="control-group">
            <label>Speed</label>
            <input type="range" id="speed" min="0.1" max="3" step="0.1" value="1">
        </div>
        
        <button onclick="changeAnimation()">Change Animation</button>
    </div>
    
    <div class="info">
        Creative typography animations using FontParser
    </div>

    <script src="../font-parser.js"></script>
    <script>
        class CreativeTypography {
            constructor() {
                this.canvas = document.getElementById('canvas');
                this.ctx = this.canvas.getContext('2d');
                this.parser = new FontParser();
                this.font = null;
                
                // Animation properties
                this.time = 0;
                this.animationType = 'wave';
                this.speed = 1;
                this.particles = [];
                this.morphProgress = 0;
                this.morphDirection = 1;
                
                // Text properties
                this.text = 'CREATIVE';
                this.fontSize = 150;
                this.paths = [];
                this.points = [];
                
                this.setupCanvas();
                this.loadFont();
                this.animate();
            }

            setupCanvas() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
                
                window.addEventListener('resize', () => {
                    this.canvas.width = window.innerWidth;
                    this.canvas.height = window.innerHeight;
                    this.generatePaths();
                });
            }

            async loadFont() {
                try {
                    this.font = await this.parser.from('../fonts/BebasNeue-Regular.ttf');
                    this.generatePaths();
                } catch (error) {
                    console.error('Error loading font:', error);
                }
            }

            generatePaths() {
                if (!this.font) return;
                
                const result = this.parser.path(this.text, { size: this.fontSize });
                this.paths = result.characters;
                
                // Calculate center position
                const [vbX, vbY, vbWidth, vbHeight] = result.viewBox.split(' ').map(Number);
                this.offsetX = (this.canvas.width - vbWidth) / 2 - vbX;
                this.offsetY = (this.canvas.height - vbHeight) / 2 - vbY;
                
                // Sample points from paths for particle effects
                this.samplePoints();
                
                // Initialize particles if needed
                if (this.animationType === 'particles') {
                    this.initParticles();
                }
            }

            samplePoints() {
                this.points = [];
                
                this.paths.forEach((char, charIndex) => {
                    const path = new Path2D(char.path);
                    
                    // Sample points along the path
                    const bounds = this.getPathBounds(char.path);
                    const step = 4;
                    
                    for (let x = bounds.minX; x <= bounds.maxX; x += step) {
                        for (let y = bounds.minY; y <= bounds.maxY; y += step) {
                            if (this.ctx.isPointInPath(path, x, y)) {
                                this.points.push({
                                    x: x + this.offsetX,
                                    y: y + this.offsetY,
                                    originalX: x + this.offsetX,
                                    originalY: y + this.offsetY,
                                    charIndex: charIndex,
                                    char: char.char
                                });
                            }
                        }
                    }
                });
            }

            getPathBounds(pathString) {
                const coords = pathString.match(/-?\d+\.?\d*/g);
                if (!coords) return { minX: 0, minY: 0, maxX: 100, maxY: 100 };
                
                let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                
                for (let i = 0; i < coords.length; i += 2) {
                    const x = parseFloat(coords[i]);
                    const y = parseFloat(coords[i + 1]);
                    if (!isNaN(x) && !isNaN(y)) {
                        minX = Math.min(minX, x);
                        maxX = Math.max(maxX, x);
                        minY = Math.min(minY, y);
                        maxY = Math.max(maxY, y);
                    }
                }
                
                return { minX, minY, maxX, maxY };
            }

            initParticles() {
                this.particles = this.points.map(point => ({
                    x: point.x,
                    y: point.y,
                    targetX: point.originalX,
                    targetY: point.originalY,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    size: Math.random() * 3 + 1,
                    charIndex: point.charIndex
                }));
            }

            animate() {
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                
                this.time += 0.01 * this.speed;
                
                switch (this.animationType) {
                    case 'wave':
                        this.animateWave();
                        break;
                    case 'particles':
                        this.animateParticles();
                        break;
                    case 'morph':
                        this.animateMorph();
                        break;
                    case 'explode':
                        this.animateExplode();
                        break;
                    case 'flow':
                        this.animateFlow();
                        break;
                }
                
                requestAnimationFrame(() => this.animate());
            }

            animateWave() {
                this.ctx.save();
                this.ctx.translate(this.offsetX, this.offsetY);
                
                this.paths.forEach((char, index) => {
                    this.ctx.save();
                    
                    const waveOffset = Math.sin(this.time * 2 + index * 0.5) * 20;
                    this.ctx.translate(0, waveOffset);
                    
                    const hue = (this.time * 50 + index * 40) % 360;
                    this.ctx.fillStyle = `hsl(${hue}, 70%, 60%)`;
                    
                    const path = new Path2D(char.path);
                    this.ctx.fill(path);
                    
                    this.ctx.restore();
                });
                
                this.ctx.restore();
            }

            animateParticles() {
                this.particles.forEach(particle => {
                    // Move towards target
                    const dx = particle.targetX - particle.x;
                    const dy = particle.targetY - particle.y;
                    
                    particle.vx += dx * 0.02;
                    particle.vy += dy * 0.02;
                    
                    // Apply friction
                    particle.vx *= 0.95;
                    particle.vy *= 0.95;
                    
                    // Update position
                    particle.x += particle.vx;
                    particle.y += particle.vy;
                    
                    // Draw particle
                    const hue = (particle.charIndex * 60 + this.time * 100) % 360;
                    this.ctx.fillStyle = `hsl(${hue}, 70%, 60%)`;
                    this.ctx.beginPath();
                    this.ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                    this.ctx.fill();
                });
            }

            animateMorph() {
                this.morphProgress += 0.02 * this.morphDirection * this.speed;
                
                if (this.morphProgress > 1 || this.morphProgress < 0) {
                    this.morphDirection *= -1;
                    this.morphProgress = Math.max(0, Math.min(1, this.morphProgress));
                }
                
                this.ctx.save();
                this.ctx.translate(this.offsetX, this.offsetY);
                
                this.paths.forEach((char, index) => {
                    this.ctx.save();
                    
                    const scale = 1 + Math.sin(this.morphProgress * Math.PI) * 0.3;
                    const rotation = Math.sin(this.morphProgress * Math.PI * 2 + index) * 0.2;
                    
                    const bounds = this.getPathBounds(char.path);
                    const centerX = (bounds.minX + bounds.maxX) / 2;
                    const centerY = (bounds.minY + bounds.maxY) / 2;
                    
                    this.ctx.translate(centerX, centerY);
                    this.ctx.scale(scale, scale);
                    this.ctx.rotate(rotation);
                    this.ctx.translate(-centerX, -centerY);
                    
                    const hue = (index * 60 + this.morphProgress * 180) % 360;
                    this.ctx.fillStyle = `hsl(${hue}, 70%, 60%)`;
                    
                    const path = new Path2D(char.path);
                    this.ctx.fill(path);
                    
                    this.ctx.restore();
                });
                
                this.ctx.restore();
            }

            animateExplode() {
                const explodeTime = (this.time * 0.5) % 3;
                
                this.points.forEach((point, i) => {
                    let x = point.originalX;
                    let y = point.originalY;
                    
                    if (explodeTime > 1 && explodeTime < 2) {
                        const progress = explodeTime - 1;
                        const angle = (i / this.points.length) * Math.PI * 2;
                        const distance = progress * 200 * (1 - progress);
                        
                        x += Math.cos(angle) * distance;
                        y += Math.sin(angle) * distance;
                    }
                    
                    const hue = (point.charIndex * 60 + i * 0.5) % 360;
                    this.ctx.fillStyle = `hsl(${hue}, 70%, 60%)`;
                    this.ctx.fillRect(x - 1, y - 1, 2, 2);
                });
            }

            animateFlow() {
                this.ctx.save();
                this.ctx.translate(this.offsetX, this.offsetY);
                
                // Create flowing gradient
                const gradient = this.ctx.createLinearGradient(
                    -200, 0, 
                    this.canvas.width + 200, 0
                );
                
                const offset = (this.time * 0.2) % 1;
                
                gradient.addColorStop(Math.max(0, offset - 0.3), 'transparent');
                gradient.addColorStop(offset, '#667eea');
                gradient.addColorStop(Math.min(1, offset + 0.3), 'transparent');
                
                this.ctx.fillStyle = gradient;
                
                this.paths.forEach(char => {
                    const path = new Path2D(char.path);
                    this.ctx.fill(path);
                });
                
                this.ctx.restore();
            }

            updateText(newText) {
                this.text = newText;
                this.generatePaths();
            }

            setAnimation(type) {
                this.animationType = type;
                if (type === 'particles') {
                    this.initParticles();
                }
            }

            setSpeed(speed) {
                this.speed = parseFloat(speed);
            }
        }

        // Initialize
        let creative;
        
        window.addEventListener('load', () => {
            creative = new CreativeTypography();
            
            // Event listeners
            document.getElementById('textInput').addEventListener('input', (e) => {
                creative.updateText(e.target.value || 'CREATIVE');
            });
            
            document.getElementById('animationType').addEventListener('change', (e) => {
                creative.setAnimation(e.target.value);
            });
            
            document.getElementById('speed').addEventListener('input', (e) => {
                creative.setSpeed(e.target.value);
            });
        });

        function changeAnimation() {
            const select = document.getElementById('animationType');
            const currentIndex = select.selectedIndex;
            const nextIndex = (currentIndex + 1) % select.options.length;
            select.selectedIndex = nextIndex;
            creative.setAnimation(select.value);
        }
    </script>
</body>
</html>
